services:
  telearr:
    build: .
    image: telearr:2.3.3
    container_name: telearr
    restart: unless-stopped
    env_file: .env
    user: "${PUID:-1000}:${PGID:-1000}"      # own new media files as you, not root
    ports:
      # Bound to the host LAN address. Set TELEARR_BIND_ADDR=127.0.0.1 to keep
      # it local-only and reach it through a reverse proxy instead.
      - "${TELEARR_BIND_ADDR:-0.0.0.0}:8790:8790"
    volumes:
      - ./data:/data                          # DB + Telegram session (persisted)
      - ${TELEARR_MEDIA_ROOT:?set TELEARR_MEDIA_ROOT in .env}:/media   # library root
      # *arr grabs land in /downloads/telegram/<tv|movies>/<release>/ — mount the
      # same host dir at /downloads in Sonarr/Radarr so no path mapping is needed.
      - ${PATH_TO_DOWNLOADS:-./downloads}:/downloads
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # bounded logs (Tier 2.5)
