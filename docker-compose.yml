services:
  telegrarr:
    build: .
    image: telegrarr:local      # or drop `build:` and use ghcr.io/osothevenin/telegrarr:latest
    container_name: telegrarr
    restart: unless-stopped
    env_file: .env
    # Or provision TMDB and the *arr connections here; each one set wins over the
    # saved value and can't be changed from the UI (see .env.example):
    # environment:
    #   TELEARR_TMDB_KEY: ${TMDB_KEY}
    #   TELEARR_PROWLARR_URL: http://prowlarr:9696
    #   TELEARR_PROWLARR_KEY: ${PROWLARR_KEY}
    #   TELEARR_SONARR_URL: http://sonarr:8989
    #   TELEARR_SONARR_KEY: ${SONARR_KEY}
    #   TELEARR_RADARR_URL: http://radarr:7878
    #   TELEARR_RADARR_KEY: ${RADARR_KEY}
    # The container starts as root only to apply PUID/PGID from .env (default
    # 1000): it re-owns /data and, if its owner differs, /downloads, then runs
    # the app as that user. Uncomment to skip all of that and run as a fixed user;
    # the mounted folders must then already be writable by it:
    # user: "${PUID:-1000}:${PGID:-1000}"
    security_opt: ["no-new-privileges:true"]
    ports:
      # Bound to the host LAN address. Set TELEARR_BIND_ADDR=127.0.0.1 to keep
      # it local-only and reach it through a reverse proxy instead.
      - "${TELEARR_BIND_ADDR:-0.0.0.0}:8790:8790"
    volumes:
      - ./data:/data                          # DB + Telegram session (persisted)
      # Library root for standalone mode; *arr mode does not use it.
      - ${TELEARR_MEDIA_ROOT:-./media}:/media
      # *arr grabs land in /downloads/telegram/<tv|movies>/<release>/ — mount the
      # same host dir at /downloads in Sonarr/Radarr so no path mapping is needed.
      - ${PATH_TO_DOWNLOADS:-./downloads}:/downloads
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # bounded logs (Tier 2.5)
