services:
  telegrarr:
    build: .
    image: telegrarr:local      # or drop `build:` and use ghcr.io/osothevenin/telegrarr:latest
    container_name: telegrarr
    restart: unless-stopped
    env_file: .env
    # The image already runs as non-root UID/GID 1000. Uncomment to own new
    # media files as a different host user (set PUID/PGID in .env):
    # user: "${PUID:-1000}:${PGID:-1000}"
    security_opt: ["no-new-privileges:true"]
    ports:
      # Bound to the host LAN address. Set TELEARR_BIND_ADDR=127.0.0.1 to keep
      # it local-only and reach it through a reverse proxy instead.
      - "${TELEARR_BIND_ADDR:-0.0.0.0}:8790:8790"
    volumes:
      - ./data:/data                          # DB + Telegram session (persisted)
      - ${TELEARR_MEDIA_ROOT:?set TELEARR_MEDIA_ROOT in .env}:/media   # library root
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # bounded logs (Tier 2.5)
