# Tooling config for Telegrarr (the app ships via Docker, not pip — this is for dev tools).
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# errors + pyflakes (unused/undefined/syntax). Style rules kept light for contributors.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# conftest must set env vars BEFORE importing app modules, so imports aren't top-of-file.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
